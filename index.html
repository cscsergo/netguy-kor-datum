<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetguY Kor és Dátum Kalkulátor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kor és Dátum">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  color-scheme: light dark;
  --text:#101523; --muted:#6a7287; --line:rgba(20,40,90,.10);
  --card:rgba(255,255,255,.74); --card-border:rgba(255,255,255,.85); --tile:rgba(240,244,255,.85);
  --shadow:0 10px 34px rgba(40,70,140,.12);
  --accent:#0a84ff; --accent2:#5e5ce6; --ok:#1fa971; --err:#e5484d;
  --seg:rgba(120,130,160,.16); --seg-on:#ffffff; --input:rgba(255,255,255,.9);
  --bg1:#cfe2ff; --bg2:#e3d8ff; --bg3:#f1f4fb;
}
@media (prefers-color-scheme: dark){
  :root{
    --text:#f3f5fb; --muted:#99a1b8; --line:rgba(255,255,255,.09);
    --card:rgba(28,31,46,.72); --card-border:rgba(255,255,255,.08); --tile:rgba(255,255,255,.06);
    --shadow:0 10px 34px rgba(0,0,0,.45);
    --accent:#4da3ff; --accent2:#8a86ff; --ok:#46d89a; --err:#ff6b70;
    --seg:rgba(255,255,255,.09); --seg-on:rgba(255,255,255,.18); --input:rgba(255,255,255,.07);
    --bg1:#12295a; --bg2:#2a1a5c; --bg3:#07080d;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  color:var(--text);
  font-family:"Hanken Grotesk","Aeonik Pro","Aeonik",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(800px 520px at 0% -8%, var(--bg1) 0%, transparent 62%),
    radial-gradient(700px 520px at 100% 0%, var(--bg2) 0%, transparent 58%),
    var(--bg3);
  background-attachment:fixed;
  min-height:100vh;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:480px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;margin:4px 0 16px}
.logo{width:52px;height:52px;border-radius:14px;box-shadow:0 6px 18px rgba(60,80,220,.35);flex:0 0 auto}
h1{font-size:28px;margin:0;letter-spacing:-.6px;line-height:1.1;
  background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:14px;margin:3px 0 0}

.seg{display:flex;background:var(--seg);border-radius:14px;padding:3px;gap:2px;margin-bottom:16px}
#tabs{position:sticky;top:8px;z-index:5;backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);box-shadow:0 4px 18px rgba(30,50,110,.10)}
.seg button{
  flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:600;
  padding:10px 4px;border-radius:11px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s,transform .1s
}
.seg button:active{transform:scale(.97)}
.seg button.on{background:var(--seg-on);color:var(--text);box-shadow:0 2px 8px rgba(20,30,70,.18)}

.card{
  background:var(--card);border:1px solid var(--card-border);border-radius:22px;padding:18px;margin-bottom:14px;
  box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)
}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;gap:10px;align-items:flex-end}
.row > *{flex:1;min-width:0}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
input[type=date],input[type=number]{
  width:100%;font:inherit;font-size:17px;font-weight:500;color:var(--text);background:var(--input);
  border:1px solid var(--line);border-radius:14px;padding:11px 14px;min-height:48px;appearance:none;-webkit-appearance:none;
  transition:border-color .15s,box-shadow .15s
}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.mini{
  border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font:inherit;font-size:14px;font-weight:700;
  padding:0 18px;border-radius:14px;cursor:pointer;flex:0 0 auto;min-height:48px;box-shadow:0 6px 16px rgba(70,90,230,.35);transition:transform .1s
}
.mini:active{transform:scale(.95)}

.hero{
  text-align:center;padding:26px 16px 22px;color:#fff;border:0;
  background:linear-gradient(135deg,#2f93ff 0%,#5e5ce6 60%,#8a4fe0 100%);
  box-shadow:0 14px 36px rgba(80,90,230,.38);position:relative;overflow:hidden
}
.hero::after{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::before{content:"";position:absolute;width:150px;height:150px;left:-50px;bottom:-70px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero > *{position:relative;z-index:1}
.ymd{display:flex;justify-content:center;gap:10px}
.ymd .u{flex:1;max-width:120px;background:rgba(255,255,255,.16);border-radius:16px;padding:12px 4px 10px}
.ymd .u b{display:block;font-size:38px;line-height:1;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ymd .u span{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;opacity:.85}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
.hero .small{color:rgba(255,255,255,.88);font-size:14px;margin-top:12px}
.hero .ok{color:#c5ffe3;font-weight:700}
.pill{display:inline-block;background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;margin-top:14px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--tile);border-radius:16px;padding:13px 14px;border:1px solid var(--line)}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat span{font-size:12px;color:var(--muted);font-weight:500}
.stat:nth-child(6n+1) b{color:#0a84ff}
.stat:nth-child(6n+2) b{color:#7d5cf0}
.stat:nth-child(6n+3) b{color:#12a8a0}
.stat:nth-child(6n+4) b{color:#f08a1c}
.stat:nth-child(6n+5) b{color:#e5527a}
.stat:nth-child(6n+6) b{color:#2fb56a}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.list li:first-child{padding-top:2px}
.list li:last-child{border-bottom:0;padding-bottom:2px}
.list li span:first-child{color:var(--muted)}
.list li span:last-child{text-align:right;font-weight:600}
.err{color:var(--err);font-size:14px;text-align:center;padding:10px 0;font-weight:600}
.hint{color:var(--muted);font-size:12.5px;margin:12px 4px 0;text-align:center}
.card .hint{text-align:left;margin:12px 0 0}
.panel{display:none}
.panel.on{display:block;animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel.on{animation:none}}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px;opacity:.8}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <img class="logo" src="favicon.svg" alt="">
    <div>
      <h1>Kor és Dátum</h1>
      <p class="sub">Kor, dátumkülönbség és dátumszámolás egy helyen.</p>
    </div>
  </header>

  <div class="seg" id="tabs" role="tablist">
    <button class="on" data-tab="age">Kor</button>
    <button data-tab="diff">Különbség</button>
    <button data-tab="add">Dátum +/−</button>
  </div>

  <!-- KOR -->
  <section class="panel on" id="p-age">
    <div class="card">
      <div class="field">
        <label for="birth">Születési dátum</label>
        <input type="date" id="birth" min="1900-01-01" max="2100-12-31">
      </div>
      <div class="field">
        <label for="ageTo">Ennyi idős ekkor (alapból ma)</label>
        <div class="row">
          <input type="date" id="ageTo" min="1900-01-01" max="2100-12-31">
          <button class="mini" id="ageToday" type="button">Ma</button>
        </div>
      </div>
    </div>
    <div id="ageOut"></div>
  </section>

  <!-- KÜLÖNBSÉG -->
  <section class="panel" id="p-diff">
    <div class="card">
      <div class="field">
        <label for="d1">Kezdődátum</label>
        <div class="row">
          <input type="date" id="d1" min="1900-01-01" max="2100-12-31">
          <button class="mini" id="d1Today" type="button">Ma</button>
        </div>
      </div>
      <div class="field">
        <label for="d2">Végdátum</label>
        <div class="row">
          <input type="date" id="d2" min="1900-01-01" max="2100-12-31">
          <button class="mini" id="d2Today" type="button">Ma</button>
        </div>
      </div>
    </div>
    <div id="diffOut"></div>
  </section>

  <!-- DÁTUM +/- -->
  <section class="panel" id="p-add">
    <div class="card">
      <div class="field">
        <label for="a0">Kiinduló dátum</label>
        <div class="row">
          <input type="date" id="a0" min="1900-01-01" max="2100-12-31">
          <button class="mini" id="a0Today" type="button">Ma</button>
        </div>
      </div>
      <div class="field">
        <div class="seg" id="signSeg" style="margin-bottom:0">
          <button class="on" data-sign="1" type="button">Hozzáadás</button>
          <button data-sign="-1" type="button">Kivonás</button>
        </div>
      </div>
      <div class="grid" style="grid-template-columns:repeat(4,1fr)">
        <div><label for="aY">Év</label><input type="number" id="aY" min="0" max="500" value="0" inputmode="numeric"></div>
        <div><label for="aM">Hónap</label><input type="number" id="aM" min="0" max="6000" value="0" inputmode="numeric"></div>
        <div><label for="aW">Hét</label><input type="number" id="aW" min="0" max="30000" value="0" inputmode="numeric"></div>
        <div><label for="aD">Nap</label><input type="number" id="aD" min="0" max="200000" value="0" inputmode="numeric"></div>
      </div>
    </div>
    <div id="addOut"></div>
  </section>

  <footer>NetguY · Kor és Dátum Kalkulátor V1.0</footer>
</div>

<script>
/* ===== LOGIKA (tiszta függvények) ===== */
const DAY = 864e5;
const HU_MONTHS = ['január','február','március','április','május','június','július','augusztus','szeptember','október','november','december'];
const HU_DAYS = ['vasárnap','hétfő','kedd','szerda','csütörtök','péntek','szombat'];

function parseISO(s){
  if(!s) return null;
  const p = s.split('-').map(Number);
  if(p.length !== 3 || !p[0] || !p[1] || !p[2]) return null;
  return new Date(Date.UTC(p[0], p[1]-1, p[2]));
}
function todayUTC(){
  const n = new Date();
  return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
}
function toISO(d){ return d.toISOString().slice(0,10); }
function daysInMonth(y, m){ return new Date(Date.UTC(y, m+1, 0)).getUTCDate(); }
function addMonths(d, n){
  const first = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+n, 1));
  const y = first.getUTCFullYear(), m = first.getUTCMonth();
  return new Date(Date.UTC(y, m, Math.min(d.getUTCDate(), daysInMonth(y, m))));
}
function addDays(d, n){ return new Date(d.getTime() + n*DAY); }
function diffYMD(a, b){ // a <= b
  let m = (b.getUTCFullYear()-a.getUTCFullYear())*12 + b.getUTCMonth() - a.getUTCMonth();
  if(addMonths(a, m) > b) m--;
  const days = Math.round((b - addMonths(a, m)) / DAY);
  return { y: Math.floor(m/12), m: m % 12, d: days, totalMonths: m, totalDays: Math.round((b-a)/DAY) };
}
function weekdaysBetween(a, b){ // H–P, mindkét végnapot beleértve, a <= b
  let n = 0;
  for(let t = a.getTime(); t <= b.getTime(); t += DAY){
    const w = new Date(t).getUTCDay();
    if(w !== 0 && w !== 6) n++;
  }
  return n;
}
function zodiac(d){
  const m = d.getUTCMonth()+1, day = d.getUTCDate(), v = m*100+day;
  if(v>=321 && v<=419) return 'Kos';
  if(v>=420 && v<=520) return 'Bika';
  if(v>=521 && v<=620) return 'Ikrek';
  if(v>=621 && v<=722) return 'Rák';
  if(v>=723 && v<=822) return 'Oroszlán';
  if(v>=823 && v<=922) return 'Szűz';
  if(v>=923 && v<=1022) return 'Mérleg';
  if(v>=1023 && v<=1121) return 'Skorpió';
  if(v>=1122 && v<=1221) return 'Nyilas';
  if(v>=1222 || v<=119) return 'Bak';
  if(v>=120 && v<=218) return 'Vízöntő';
  return 'Halak';
}
function fmtDate(d){
  return d.getUTCFullYear()+'. '+HU_MONTHS[d.getUTCMonth()]+' '+d.getUTCDate()+'., '+HU_DAYS[d.getUTCDay()];
}
function nf(n){ return Math.round(n).toLocaleString('hu-HU'); }
function ymdText(r){
  return '<div class="ymd">'+
    '<div class="u"><b>'+r.y+'</b><span>év</span></div>'+
    '<div class="u"><b>'+r.m+'</b><span>hónap</span></div>'+
    '<div class="u"><b>'+r.d+'</b><span>nap</span></div></div>';
}
function relDays(n){
  if(n === 0) return 'ma van';
  return n > 0 ? nf(n)+' nap múlva' : nf(-n)+' napja volt';
}
/* ===== /LOGIKA ===== */

const $ = id => document.getElementById(id);
const stat = (v, l) => '<div class="stat"><b>'+v+'</b><span>'+l+'</span></div>';

/* Fülek */
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-'+b.dataset.tab));
  try { sessionStorage.setItem('kdTab', b.dataset.tab); } catch(e){}
}));

/* KOR */
function renderAge(){
  const birth = parseISO($('birth').value), to = parseISO($('ageTo').value) || todayUTC();
  const out = $('ageOut');
  if(!birth){ out.innerHTML = '<p class="hint">Add meg a születési dátumot.</p>'; return; }
  if(birth > to){ out.innerHTML = '<p class="err">A születési dátum a célnap után van.</p>'; return; }
  const r = diffYMD(birth, to);
  const hours = r.totalDays*24, mins = hours*60;
  let k = to.getUTCFullYear() - birth.getUTCFullYear();
  let nb = addMonths(birth, 12*k);
  if(nb < to){ k++; nb = addMonths(birth, 12*k); }
  const left = Math.round((nb - to)/DAY);
  const isToday = left === 0;
  out.innerHTML =
    '<div class="card hero">'+ymdText(r)+''+
    '<div class="small">'+(r.y)+' éves'+(isToday?' · <span class="ok">ma van a születésnapod! 🎂</span>':'')+'</div></div>'+
    '<div class="card"><div class="grid">'+
      stat(nf(r.totalMonths), 'hónap')+
      stat(nf(r.totalDays/7), 'hét (kerekítve)')+
      stat(nf(r.totalDays), 'nap')+
      stat(nf(hours), 'óra')+
      stat(nf(mins), 'perc')+
      stat(nf(mins*60), 'másodperc')+
    '</div></div>'+
    '<div class="card"><ul class="list">'+
      '<li><span>Született</span><span>'+fmtDate(birth)+'</span></li>'+
      '<li><span>Következő születésnap</span><span>'+(isToday?'Ma!':fmtDate(nb))+'</span></li>'+
      '<li><span>Hátra</span><span>'+(isToday?'0 nap':nf(left)+' nap')+' ('+k+'. születésnap)</span></li>'+
      '<li><span>Csillagjegy</span><span>'+zodiac(birth)+'</span></li>'+
    '</ul></div>';
}

/* KÜLÖNBSÉG */
function renderDiff(){
  let a = parseISO($('d1').value), b = parseISO($('d2').value);
  const out = $('diffOut');
  if(!a || !b){ out.innerHTML = '<p class="hint">Add meg mindkét dátumot.</p>'; return; }
  const swapped = a > b;
  if(swapped){ const t = a; a = b; b = t; }
  const r = diffYMD(a, b);
  const wd = weekdaysBetween(a, b);
  out.innerHTML =
    '<div class="card hero">'+ymdText(r)+''+
    '<div class="small">'+nf(r.totalDays)+' nap telik el '+fmtDate(a).split(',')[0]+' és '+fmtDate(b).split(',')[0]+' között'+(swapped?' (a sorrendet felcseréltem)':'')+'</div></div>'+
    '<div class="card"><div class="grid">'+
      stat(nf(r.totalDays), 'nap')+
      stat(nf(Math.floor(r.totalDays/7))+' hét '+(r.totalDays%7)+' nap', 'hetekben')+
      stat(nf(r.totalMonths), 'teljes hónap')+
      stat(nf(r.totalDays*24), 'óra')+
    '</div></div>'+
    '<div class="card"><ul class="list">'+
      '<li><span>Kezdet</span><span>'+fmtDate(a)+'</span></li>'+
      '<li><span>Vég</span><span>'+fmtDate(b)+'</span></li>'+
      '<li><span>Hétköznap (H–P)</span><span>'+nf(wd)+' nap</span></li>'+
      '<li><span>Hétvégi nap</span><span>'+nf(r.totalDays+1-wd)+' nap</span></li>'+
    '</ul><p class="hint">A hétköznapok száma mindkét végnapot tartalmazza, az ünnepnapokat nem vonja le.</p></div>';
}

/* DÁTUM +/- */
let sign = 1;
document.querySelectorAll('#signSeg button').forEach(b => b.addEventListener('click', () => {
  sign = Number(b.dataset.sign);
  document.querySelectorAll('#signSeg button').forEach(x => x.classList.toggle('on', x === b));
  renderAdd();
}));
function num(id){ const v = parseInt($(id).value, 10); return isNaN(v) || v < 0 ? 0 : v; }
function renderAdd(){
  const s = parseISO($('a0').value);
  const out = $('addOut');
  if(!s){ out.innerHTML = '<p class="hint">Add meg a kiinduló dátumot.</p>'; return; }
  const y = num('aY'), m = num('aM'), w = num('aW'), d = num('aD');
  const res = addDays(addMonths(s, sign*(y*12+m)), sign*(w*7+d));
  const yr = res.getUTCFullYear();
  if(yr < 1 || yr > 9999){ out.innerHTML = '<p class="err">Az eredmény kívül esik a támogatott tartományon.</p>'; return; }
  const diff = Math.round((res - todayUTC())/DAY);
  out.innerHTML =
    '<div class="card hero"><div class="big">'+res.getUTCFullYear()+'. '+HU_MONTHS[res.getUTCMonth()]+' '+res.getUTCDate()+'.</div>'+
    '<div class="small">'+HU_DAYS[res.getUTCDay()]+'</div>'+
    '<div class="pill">Ma-hoz képest: '+relDays(diff)+'</div></div>';
}

/* Események + kezdőértékek */
['birth','ageTo'].forEach(i => $(i).addEventListener('input', renderAge));
['d1','d2'].forEach(i => $(i).addEventListener('input', renderDiff));
['a0','aY','aM','aW','aD'].forEach(i => $(i).addEventListener('input', renderAdd));
$('ageToday').onclick = () => { $('ageTo').value = toISO(todayUTC()); renderAge(); };
$('d1Today').onclick = () => { $('d1').value = toISO(todayUTC()); renderDiff(); };
$('d2Today').onclick = () => { $('d2').value = toISO(todayUTC()); renderDiff(); };
$('a0Today').onclick = () => { $('a0').value = toISO(todayUTC()); renderAdd(); };

const t0 = toISO(todayUTC());
$('ageTo').value = t0; $('d1').value = t0; $('d2').value = t0; $('a0').value = t0;
renderAge(); renderDiff(); renderAdd();
try {
  const t = sessionStorage.getItem('kdTab');
  if(t){ const b = document.querySelector('#tabs button[data-tab="'+t+'"]'); if(b) b.click(); }
} catch(e){}
</script>
</body>
</html>
